name: Deploy TravBud IdeaLab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /travbud-idealab/
          VITE_SUPABASE_URL: https://rsnmwoxawgmpebiusuqr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_BHDoxPD_pAnYAKD5t7QCTg_swTH27k-
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4